<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b1220" />
<title>Coach Dashboard</title>
<style>
  :root{
    --bg:#0b1220; --card:#141d2e; --card2:#1c2740; --line:#27324a;
    --text:#e8edf6; --muted:#93a0ba; --accent:#2dd4bf;
    --grad:linear-gradient(135deg,#2dd4bf,#38bdf8 50%,#a78bfa);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(900px 500px at 80% -10%,rgba(56,189,248,.10),transparent 60%),
      radial-gradient(800px 500px at -10% 0%,rgba(167,139,250,.10),transparent 55%),var(--bg);
    background-attachment:fixed;color:var(--text);line-height:1.5;padding-bottom:40px}
  header{position:sticky;top:0;z-index:5;background:rgba(11,18,32,.86);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 14px) 16px 14px}
  header h1{margin:0;font-size:19px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  header .sub{font-size:12px;color:var(--muted);margin-top:3px}
  main{max-width:820px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
  .card h2{font-size:14px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.6px;color:var(--accent)}
  .stat{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
  .stat:last-child{border-bottom:none} .stat b{color:var(--text)}
  .kpis{display:flex;gap:10px;flex-wrap:wrap}
  .kpi{flex:1;min-width:120px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
  .kpi .v{font-size:22px;font-weight:800} .kpi .l{font-size:11px;color:var(--muted);margin-top:2px}
  .kpi .v.good{color:#34d399}
  .chip-row{display:flex;gap:8px;margin-bottom:12px}
  .chip{flex:1;text-align:center;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--muted);font-weight:700;font-size:13px;cursor:pointer}
  .chip.active{color:#04201d;background:var(--grad);border-color:transparent}
  .ch-now{font-weight:800;font-size:20px;margin-bottom:2px}
  .chart-wrap svg{width:100%;height:auto;display:block}
  .dim{color:var(--muted);font-size:12px}
  .pill{display:inline-block;font-size:11px;padding:3px 9px;border-radius:999px;background:var(--card2);color:var(--muted);border:1px solid var(--line);margin-left:6px}
  pre.notes{white-space:pre-wrap;font-family:inherit;font-size:13px;color:var(--muted);margin:0}
</style>
</head>
<body>
<header>
  <h1 id="title">Coach Dashboard</h1>
  <div class="sub" id="subtitle">Read-only view</div>
</header>
<main id="app"><div class="card"><div class="dim">Loading…</div></div></main>

<script>
(function(){
  "use strict";
  const $=s=>document.querySelector(s);
  const params=new URLSearchParams(location.search);
  const gid=params.get("gist")||params.get("g");
  const FILE="coach-checkin-data.json";
  const STEP_GOAL=8000, WATER_GOAL_ML=3000;
  let curRange=90, DATA=null;

  function hasData(d){ if(!d) return false;
    return (d.meals||[]).some(Boolean)||(d.steps!==""&&d.steps!=null)||(d.waterMl||0)>0||
      d.cardio||d.crossfit||d.weights||d.restDay||(d.weight!==""&&d.weight!=null)||
      (d.sleep!==""&&d.sleep!=null)||d.supps||(d.note&&d.note.trim())||
      d.dStamina||d.dPumps||d.dStrength||d.dEnergy||d.dSore||d.dDigestion||d.dBM; }
  function goalsMet(d){ let g=0;
    if((d.meals||[]).every(Boolean)) g++;
    if((d.waterMl||0)>=WATER_GOAL_ML) g++;
    if((parseInt(d.steps,10)||0)>=STEP_GOAL) g++;
    if(d.cardio||d.crossfit||d.weights||d.restDay) g++; return g; }
  function dayComplete(d){ return goalsMet(d)===4; }
  function fmtDate(k){ const p=k.split("-"); return p[1]+"/"+p[2]; }
  function logsObj(){ return (DATA&&DATA.logs)||{}; }
  function allDays(){ const l=logsObj(); return Object.keys(l).filter(k=>hasData(l[k])).sort(); }
  function cutoff(){ const c=new Date(); c.setDate(c.getDate()-curRange); return c; }

  function seriesFromLogs(field){
    const co=cutoff(), l=logsObj(), pts=[];
    allDays().forEach(k=>{ if(new Date(k+"T00:00:00")<co) return; const d=l[k]; let val=d[field];
      if(field==="diet"){ val=(d.meals||[]).filter(Boolean).length/4*100; }
      else if(field==="waterL"){ val=(d.waterMl||0)/1000; }
      else { if(val===""||val==null) return; val=parseFloat(val); }
      if(val==null||isNaN(val)) return; pts.push({x:k,y:val}); });
    return pts;
  }
  function weightSeries(){
    const co=cutoff(), l=logsObj(), map={};
    allDays().forEach(k=>{ const d=l[k]; if(d.weight!==""&&d.weight!=null && new Date(k+"T00:00:00")>=co) map[k]=parseFloat(d.weight); });
    ((DATA&&DATA.checkins)||[]).forEach(c=>{ if(c.endW && new Date(c.date+"T00:00:00")>=co) map[c.date]=parseFloat(c.endW); });
    return Object.keys(map).sort().map(k=>({x:k,y:map[k]})).filter(p=>!isNaN(p.y));
  }
  function trainingByWeek(){
    const co=cutoff(), l=logsObj(), wk={};
    allDays().forEach(k=>{ const d=l[k]; if(new Date(k+"T00:00:00")<co) return;
      if(d.crossfit||d.weights){ const dt=new Date(k+"T00:00:00"); const oj=new Date(dt.getFullYear(),0,1);
        const w=Math.ceil((((dt-oj)/86400000)+oj.getDay()+1)/7); wk[dt.getFullYear()+"-W"+w]=(wk[dt.getFullYear()+"-W"+w]||0)+1; } });
    return Object.keys(wk).sort().map(k=>({x:k.split("-W")[1],y:wk[k]}));
  }
  function bestStreak(){
    const l=logsObj(); const keys=Object.keys(l).filter(k=>l[k]&&dayComplete(l[k])).sort();
    let best=0,cur=0,prev=null;
    keys.forEach(k=>{ if(prev){ const diff=(new Date(k)-new Date(prev))/86400000; cur=diff===1?cur+1:1; } else cur=1; best=Math.max(best,cur); prev=k; });
    return best;
  }
  function last(pts){ return pts.length?pts[pts.length-1].y:null; }

  function lineChartSVG(pts,opts){
    opts=opts||{}; const W=700,H=200,pad=28;
    if(pts.length===0) return '<div class="dim" style="padding:18px 4px">No data yet.</div>';
    const ys=pts.map(p=>p.y); let mn=Math.min(...ys),mx=Math.max(...ys); if(mn===mx){mn-=1;mx+=1;} const span=mx-mn;
    const X=i=>pad+(pts.length===1?0.5:i/(pts.length-1))*(W-pad*2), Y=y=>H-pad-((y-mn)/span)*(H-pad*2);
    const col=opts.color||"#2dd4bf"; let d=""; pts.forEach((p,i)=>{ d+=(i?"L":"M")+X(i).toFixed(1)+" "+Y(p.y).toFixed(1)+" "; });
    const area=d+"L"+X(pts.length-1).toFixed(1)+" "+(H-pad)+" L"+X(0).toFixed(1)+" "+(H-pad)+" Z";
    const dots=pts.length<=30?pts.map((p,i)=>'<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="2.5" fill="'+col+'"/>').join(""):"";
    const gid="g"+Math.random().toString(36).slice(2,7);
    return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none"><defs><linearGradient id="'+gid+'" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="'+col+'" stop-opacity="0.28"/><stop offset="1" stop-color="'+col+'" stop-opacity="0"/></linearGradient></defs>'
      +'<path d="'+area+'" fill="url(#'+gid+')"/><path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+dots
      +'<text x="'+pad+'" y="14" fill="#93a0ba" font-size="11">'+mx.toFixed(opts.dp==null?0:opts.dp)+'</text>'
      +'<text x="'+pad+'" y="'+(H-6)+'" fill="#93a0ba" font-size="11">'+mn.toFixed(opts.dp==null?0:opts.dp)+'</text></svg>';
  }
  function barChartSVG(pts,opts){
    opts=opts||{}; const W=700,H=200,pad=28;
    if(pts.length===0) return '<div class="dim" style="padding:18px 4px">No training logged.</div>';
    const mx=Math.max(...pts.map(p=>p.y),1),col=opts.color||"#a78bfa",bw=(W-pad*2)/pts.length*0.6,gap=(W-pad*2)/pts.length;
    let bars=""; pts.forEach((p,i)=>{ const h=(p.y/mx)*(H-pad*2),x=pad+i*gap+(gap-bw)/2,y=H-pad-h;
      bars+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3" fill="'+col+'"/>'
        +'<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-pad+14)+'" fill="#93a0ba" font-size="10" text-anchor="middle">W'+p.x+'</text>'
        +'<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" fill="#e8edf6" font-size="11" text-anchor="middle">'+p.y+'</text>'; });
    return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+bars+'</svg>';
  }
  function chartCard(title,now,svg){ return '<div class="card"><h2>'+title+'</h2>'+(now!=null?'<div class="ch-now">'+now+'</div>':'')+'<div class="chart-wrap">'+svg+'</div></div>'; }

  function latestCheckinCard(){
    const cs=(DATA&&DATA.checkins)||[]; if(!cs.length) return '';
    const c=cs[cs.length-1];
    const rows=[["Start weight",c.startW?c.startW+" lb"+(c.startT?" ("+c.startT+")":""):"—"],
      ["End weight",c.endW?c.endW+" lb"+(c.endT?" ("+c.endT+")":""):"—"],
      ["% Diet followed",c.diet?c.diet+"%":"—"],["Hunger (1–10)",c.hunger||"—"],
      ["Cardio missed",c.cardioMiss||"0"],["Training missed",c.trainMiss||"0"],
      ["Stamina (1–10)",c.stamina||"—"],["Strength",c.strength||"—"],["Pumps (1–10)",c.pumps||"—"],
      ["Daytime energy",c.dayEnergy||"—"],["Soreness >2 days",c.soreness||"—"],
      ["Digestion vs baseline",c.digestion||"—"],["Daily BM",c.bm||"—"]];
    let html='<div class="card"><h2>Latest Check-In <span class="pill">'+fmtDate(c.date)+'</span></h2>'
      +rows.map(r=>'<div class="stat"><span>'+r[0]+'</span><b>'+r[1]+'</b></div>').join("");
    if(c.comments) html+='<div style="margin-top:10px"><div class="dim" style="margin-bottom:4px">Comments</div><pre class="notes">'+escapeHtml(c.comments)+'</pre></div>';
    html+='</div>'; return html;
  }
  function escapeHtml(s){ return (s||"").replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m])); }

  function render(updatedAt){
    const name=(DATA.settings&&DATA.settings.name)||"Athlete";
    $("#title").textContent=name+" — Progress";
    $("#subtitle").textContent="Coach view · read-only"+(updatedAt?" · updated "+new Date(updatedAt).toLocaleString():"");
    const wt=weightSeries(), st=seriesFromLogs("steps"), sl=seriesFromLogs("sleep"), wa=seriesFromLogs("waterL"),
      di=seriesFromLogs("diet"), sta=seriesFromLogs("dStamina"), pu=seriesFromLogs("dPumps"), tw=trainingByWeek();
    const logged=allDays().length, bs=bestStreak();
    let wDelta="—";
    if(wt.length>=2){ const d=wt[wt.length-1].y-wt[0].y; wDelta=(d>0?"+":"")+d.toFixed(1)+" lb"; }
    let html='';
    html+='<div class="card"><div class="kpis">'
      +'<div class="kpi"><div class="v">'+logged+'</div><div class="l">days logged</div></div>'
      +'<div class="kpi"><div class="v good">'+bs+'</div><div class="l">best streak</div></div>'
      +'<div class="kpi"><div class="v">'+((DATA.checkins||[]).length)+'</div><div class="l">check-ins</div></div>'
      +'<div class="kpi"><div class="v">'+wDelta+'</div><div class="l">weight Δ (range)</div></div>'
      +'</div>'
      +'<div class="chip-row" style="margin-top:14px">'
      +'<div class="chip'+(curRange===30?" active":"")+'" data-range="30">30d</div>'
      +'<div class="chip'+(curRange===90?" active":"")+'" data-range="90">90d</div>'
      +'<div class="chip'+(curRange===9999?" active":"")+'" data-range="9999">All</div>'
      +'</div></div>';
    html+=latestCheckinCard();
    html+=chartCard("Bodyweight (lb)", wt.length?last(wt).toFixed(1)+" lb":null, lineChartSVG(wt,{color:"#2dd4bf",dp:1}));
    html+=chartCard("Steps / day", st.length?Math.round(last(st)).toLocaleString():null, lineChartSVG(st,{color:"#38bdf8",dp:0}));
    html+=chartCard("Sleep (h)", sl.length?last(sl).toFixed(1)+" h":null, lineChartSVG(sl,{color:"#a78bfa",dp:1}));
    html+=chartCard("Water (L)", wa.length?last(wa).toFixed(1)+" L":null, lineChartSVG(wa,{color:"#34d399",dp:1}));
    html+=chartCard("Diet adherence (%)", di.length?Math.round(last(di))+"%":null, lineChartSVG(di,{color:"#fbbf24",dp:0}));
    html+=chartCard("Gym stamina (1–10)", sta.length?last(sta).toFixed(0):null, lineChartSVG(sta,{color:"#fb923c",dp:0}));
    html+=chartCard("Pumps (1–10)", pu.length?last(pu).toFixed(0):null, lineChartSVG(pu,{color:"#f472b6",dp:0}));
    html+=chartCard("Training days / week", null, barChartSVG(tw,{color:"#a78bfa"}));
    $("#app").innerHTML=html;
    document.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>{ curRange=parseInt(c.dataset.range,10); render(updatedAt); }));
  }

  async function loadData(){
    if(!gid){ $("#app").innerHTML='<div class="card"><div class="dim">No data link provided. Ask the athlete for their coach dashboard link.</div></div>'; return; }
    try{
      const res=await fetch("https://api.github.com/gists/"+gid);
      if(!res.ok) throw new Error("HTTP "+res.status);
      const g=await res.json(); const f=g.files&&g.files[FILE];
      if(!f) throw new Error("No data found in this link.");
      let content=f.content;
      if(f.truncated && f.raw_url){ content=await (await fetch(f.raw_url)).text(); }
      DATA=JSON.parse(content);
      render(g.updated_at);
    }catch(e){ $("#app").innerHTML='<div class="card"><div class="dim">Couldn’t load the dashboard: '+e.message+'. The link may be wrong or revoked.</div></div>'; }
  }
  loadData();
})();
</script>
</body>
</html>
